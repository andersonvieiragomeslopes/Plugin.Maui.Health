name: Publish Preview NuGet to GitHub Packages

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"

jobs:
  publish-preview:

    runs-on: windows-latest

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0   # full history so git describe can find the latest tag

      - name: Compute preview version
        id: version
        shell: bash
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          BASE=${LATEST_TAG#v}
          PREVIEW="${BASE}-preview.${{ github.run_number }}"
          echo "version=${PREVIEW}" >> $GITHUB_OUTPUT

      - name: Pack
        run: dotnet pack src\Plugin.Maui.Health.sln -c Release -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push
          src\Plugin.Maui.Health\bin\Release\Plugin.Maui.Health.${{ steps.version.outputs.version }}.nupkg
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
